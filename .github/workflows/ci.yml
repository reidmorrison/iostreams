name: build

on:
  - push
  - pull_request

jobs:
  test:
    name: "Test: Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    # Tests take about 7 minutes; without a limit a hang runs for six hours.
    timeout-minutes: 30
    permissions:
      # To push the coverage badge to the badges branch.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.2, 3.3, 3.4, "4.0", jruby]
        # Measure coverage on one MRI version only.
        include:
          - ruby: 3.4
            coverage: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        timeout-minutes: 10
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 1
      - name: Ruby Version
        run: ruby --version
      - name: Bundle Install with Retry (fallback)
        timeout-minutes: 10
        if: failure()
        run: |
          echo "Bundler cache failed, retrying bundle install..."
          for i in {1..3}; do
            if bundle install --jobs 4 --retry 3; then
              break
            fi
            echo "Bundle install attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
      - name: Start SFTP Server
        timeout-minutes: 10
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q sshpass
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/sftp_identity"
          # Pull from GitHub's registry rather than lscr.io, which rate limits the parallel jobs,
          # retrying with a backoff in case it is rate limited too.
          image=ghcr.io/linuxserver/openssh-server:latest
          for i in 1 2 3 4 5; do
            docker pull -q "$image" && break
            [ "$i" -eq 5 ] && exit 1
            echo "Pull attempt $i failed, retrying in $((i * 10)) seconds..."
            sleep $((i * 10))
          done
          docker run -d --name iostreams-sftp -p 2222:2222 \
            -e USER_NAME=iostreams -e USER_PASSWORD=iostreams -e PASSWORD_ACCESS=true \
            -e PUBLIC_KEY="$(cat "$RUNNER_TEMP/sftp_identity.pub")" \
            "$image"
          # Only the ed25519 key, so that #each_child needs the ed25519 gem to verify it.
          for i in $(seq 1 60); do
            host_key="$(ssh-keyscan -p 2222 -t ed25519 localhost 2>/dev/null || true)"
            [ -n "$host_key" ] && break
            sleep 1
          done
          [ -n "$host_key" ] || { docker logs iostreams-sftp; exit 1; }
          docker exec -u iostreams iostreams-sftp mkdir -p /config/iostreams_test
          {
            echo "SFTP_HOSTNAME=localhost:2222"
            echo "SFTP_USERNAME=iostreams"
            echo "SFTP_PASSWORD=iostreams"
            echo "SFTP_DIR=~/iostreams_test"
            echo "SFTP_IDENTITY_FILE=$RUNNER_TEMP/sftp_identity"
            echo "SFTP_HOST_KEY=$host_key"
          } >> "$GITHUB_ENV"
      - name: Run Tests
        if: ${{ !matrix.coverage }}
        run: bundle exec rake
      # A separate step because test_helper.rb enables coverage when COVERAGE is set at all, even to "".
      - name: Run Tests with Coverage
        if: ${{ matrix.coverage }}
        run: bundle exec rake
        env:
          COVERAGE: true
      - name: Publish Coverage Badge
        if: ${{ matrix.coverage && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write a shields.io endpoint file from SimpleCov's summary.
          mkdir "$RUNNER_TEMP/badges"
          ruby -rjson -e '
            percent = JSON.parse(File.read("coverage/.last_run.json")).dig("result", "line")
            color   = {90 => "brightgreen", 80 => "green", 70 => "yellow", 60 => "orange"}.find { |min, _| percent >= min }&.last || "red"
            badge   = {schemaVersion: 1, label: "coverage", message: format("%.1f%%", percent), color: color}
            File.write(ARGV[0], JSON.generate(badge))
          ' "$RUNNER_TEMP/badges/coverage.json"
          # Replace the badges branch with a single commit so that it never accumulates history.
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update coverage badge"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
